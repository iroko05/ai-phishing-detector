# AI-Phishing Gateway: бэкенд (REST + MTA) и SOC-дашборд.
# Конфигурация — в .env (см. .env.example); переменные пробрасываются
# в контейнер бэкенда через env_file, фронтенду нужны только прокси-ключи.
services:
  backend:
    build: ./backend
    container_name: phishing_backend
    env_file:
      # .env необязателен: без него шлюз стартует на дефолтах
      # (API закрыт — задайте ANTISPAM_API_KEYS)
      - path: .env
        required: false
    environment:
      ANTISPAM_API_HOST: "0.0.0.0"
    ports:
      - "8000:8000"   # REST API + Swagger (/docs)
      - "2525:2525"   # приёмный SMTP-фронт (ANTISPAM_MTA_MODE=smtp)
    volumes:
      # журнал разборов, карантин, списки, спул MTA — всё в одном томе
      - gateway-data:/app/data
    networks:
      - gateway-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: phishing_frontend
    environment:
      BACKEND_URL: http://backend:8000
      # ключи проксируются на серверной стороне и не попадают в браузер
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gateway-net
    restart: unless-stopped

networks:
  gateway-net:
    driver: bridge

volumes:
  gateway-data: